[launcher]
welcome = "everyapi — 選一個命令："
usage = '''
everyapi — EveryAPI 命令列

用法
  everyapi <命令> [參數]

命令
  login           登入此裝置到 EveryAPI
  logout          清除本裝置憑證
  status          顯示目前額度、用量與餘額
  topup           開啟錢包儲值頁（反釣魚校驗短語）
  wallet <子>     儲值紀錄 / 付款方式 / 兌換碼
  checkin         領取今日簽到額度
  user <子>       個人資訊 / 2FA / passkey / OAuth 綁定 / 推廣碼
  subscription <子>  訂閱方案 / 我的訂閱 / 計費偏好
  use <工具>      透過 EveryAPI 啟動第三方 CLI（claude / codex / gemini）
  token <子>      管理 relay API token（list / show / create / update / key / revoke / usage）
  log <子>        請求日誌：list / stat / summary
  usage           按日用量
  models <子>     模型目錄：list / pricing / groups
  upstream        上游供應商健康狀態（狀態頁彙總）
  perf            按模型效能（成功率 / 延遲 / 吞吐）
  demand <子>     買方需求貼（list/my/show/submit/cancel/remove）
  dispute <子>    爭議：開啟 / 列表 / 查看
  report          檢舉濫用 / 違規
  notify <子>     站內通知（list / count / read / readall）
  dm <子>         私訊（threads / open / send / messages / read）
  seller <子>     賣方頻道市集命令
__ADMIN_BLOCK__
  edge <子>       自帶 GPU 供應商代理（docker + ollama）
  proxy <子>      本機去敏代理（SDK 請求隱私過濾）
  mcp [子]        AI CLI 的 MCP 伺服器（Claude Code / Codex / Gemini）
  doctor          本機自我檢查（憑證、閘道、代理、工具）
  events          訂閱即時事件串流（SSE）
  settings        查看 / 修改 CLI 偏好（語言等）
  update          檢查並安裝新版本
  version         印出建置版本
  help            顯示本說明

執行 'everyapi <命令> help' 查看子命令詳情與參數
（如 'everyapi seller help'、'everyapi edge help'）。
'''
usage_admin_block = '''  admin <子>      維運命令（需要管理員角色）
'''

