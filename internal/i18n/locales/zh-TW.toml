usage = '''
everyapi token — 管理 relay API token（應用程式嵌入的 key）

用法
  everyapi token <子命令> [參數]

子命令
  list                                 列出你的 token（key 已去敏）
  show     <id>                        查看某個 token 的詳情
  key      <id>                        印出完整明文 key
  create   --name <n> [參數]           新建 token
  update   <id> [參數]                 編輯 token 欄位（不傳則保留原值）
  enable   <id>                        啟用
  disable  <id>                        停用
  revoke   <id> [-y]                   刪除 token（軟刪；非 -y 會詢問）
  usage    <key>                       查看某個 key 的剩餘額度（無需登入）

CREATE / UPDATE 參數
  --name <n>           顯示名（create 必填；最長 50 字元）
  --group <g>          路由分組（預設 "" = 自動）
  --unlimited          無額度上限（覆寫 --quota）
  --quota <int>        剩餘額度（按閘道單位；見 'everyapi status'）
  --expires <when>     "never"（create 預設）或絕對 Unix 秒
  --models <a,b,c>     限制為這些模型 id 的 CSV（不傳 / 空 → 全部）
  --ip <cidr,cidr>     IP 白名單（不傳 → 不限制）
  --cross-group        允許自動路由跨分組重試

範例
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  （印出 sk-everyapi-…）
  everyapi token revoke 42 -y
'''

