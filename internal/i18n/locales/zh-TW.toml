[edge.usage]
missing_subcommand = "缺少子命令（試試 'everyapi edge help'）"
unknown_subcommand = "未知的 'edge' 子命令 %q"
text = """everyapi edge —— BYO-GPU 供給方代理

用法
  everyapi edge <子命令> [參數]

子命令
  register [--name N] [--country CC] [--attach-to-channel ID]
        在 EveryAPI 後端建立一個節點 + 註冊權杖，並持久化到
        ~/.local/share/everyapi/edge/<node-id>/。複用你的 cli 登入
        （無需單獨貼上權杖）。用 --attach-to-channel 把節點掛到已存
        在的 edge 頻道下做多節點分流，省去新建頻道。

  list   (別名：ls)
        列出目前後端上登入使用者擁有的所有節點，頂部顯示 api_base 和帳戶
        id —— 當賣家面板什麼都不顯示、你想確認 CLI 實際連的是哪個後端 /
        帳戶時很有用。

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        偵測 GPU 硬體，把 docker-compose.yml 算繪到節點 workdir，然後
        'docker compose up -d'。首次執行會拉取 ollama + agent 映像檔。
        預設 --mode auto（nvidia-smi → nvidia，rocminfo → rocm，
        Darwin arm64 → macos，否則 → cpu）。

  status [--node ID]
        在面板視圖旁顯示 'docker compose ps'（線上 / 離線 / 已暫停、
        最後在線時間、目前模型）。

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d

  rename --name NEW [--country CC] [--region R] [--clear-location] [--node ID]
        PUT /api/seller/edge/nodes/:id，更新名稱和/或位置。同事務內
        會同步配對頻道的名稱。

  pause  [--node ID]                 手動停用配對頻道（黏性，跨重連保留）。
                                     買家流量停止路由到這裡。
  resume [--node ID]                 解除手動停用。下次 agent 心跳後頻道
                                     重新加入分流。

  remove [--node ID] [--keep-backend]
        docker compose down -v + 刪除本機 workdir。除非設定
        --keep-backend，否則還會呼叫後端的
        DELETE /api/seller/edge/nodes/<id>（在把節點重新指向另一台機器
        時很有用）。

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        封裝 'docker compose exec ollama ollama <op>'。

  help
        印出本說明。

首次執行
  $ everyapi login                    # 如果還沒登入
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

環境需求
  - PATH 上需有 docker + docker compose v2
  - Linux/Windows：NVIDIA Container Toolkit（nvidia 模式）或
    ROCm 5.7+（rocm 模式）
  - macOS（Apple Silicon）：原生 'brew install ollama && brew services
    start ollama' —— Metal 加速無法透過 docker 使用
"""

