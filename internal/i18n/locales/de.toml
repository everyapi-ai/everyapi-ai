everyapi token — Relay-API-Tokens verwalten (die Schlüssel, die deine Apps einbetten)

VERWENDUNG
  everyapi token <Unterbefehl> [Optionen]

UNTERBEFEHLE
  list                                 Deine Tokens auflisten (maskierte Schlüssel)
  show     <id>                        Ein Token im Detail anzeigen
  key      <id>                        Vollständigen Klartext-Schlüssel ausgeben
  create   --name <n> [Optionen]       Neues Token erzeugen
  update   <id> [Optionen]             Token-Felder bearbeiten (Option weglassen → aktuell behalten)
  enable   <id>                        Status auf aktiviert setzen
  disable  <id>                        Status auf deaktiviert setzen
  revoke   <id> [-y]                   Token löschen (soft-delete; fragt ohne -y)
  usage    <key>                       Verbleibende Quota eines Keys anzeigen (kein Login nötig)

CREATE / UPDATE OPTIONEN
  --name <n>           Anzeigename (bei create erforderlich; max. 50 Zeichen)
  --group <g>          Routing-Gruppe (Standard "" = automatisch)
  --unlimited          Keine Quota-Obergrenze (überschreibt --quota)
  --quota <int>        Verbleibende Quota (in Gateway-Einheiten; siehe 'everyapi status')
  --expires <wann>     "never" (Standard bei create) oder absolute Unix-Sekunden
  --models <a,b,c>     Auf diese CSV von Modell-ids beschränken (weglassen / leer → alle)
  --ip <cidr,cidr>     IP-Allowlist (weglassen → keine Beschränkung)
  --cross-group        Auto-Routing-Retry über Gruppen hinweg erlauben

BEISPIELE
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  (gibt sk-everyapi-… aus)
  everyapi token revoke 42 -y
'''

