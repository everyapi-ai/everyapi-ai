[launcher]
welcome = "everyapi — wähle einen Befehl:"
usage = '''
everyapi — EveryAPI CLI

VERWENDUNG
  everyapi <Befehl> [Optionen]

BEFEHLE
  login           Dieses Gerät bei EveryAPI authentifizieren
  logout          Anmeldedaten dieses Geräts entfernen
  status          Aktuelle Quota, Nutzung und Saldo anzeigen
  topup           Wallet-Aufladeseite öffnen (Anti-Phishing-Verifizierungsphrase)
  wallet <Sub>    Zahlungsverlauf / Methoden / Einlöse-Schlüssel
  checkin         Heutige Tageszuteilungs-Quota einlösen
  user <Sub>      Profil / 2FA / Passkey / OAuth-Bindungen / Affiliate-Code
  subscription <Sub>  Abopläne / eigene Abos / Abrechnungspräferenz
  use <Tool>      Drittanbieter-CLI über EveryAPI starten (claude / codex / gemini)
  token <Sub>     Relay-API-Tokens verwalten (list / show / create / update / key / revoke / usage)
  log <Sub>       Anfrage-Log: list / stat / summary
  usage           Tag-für-Tag Quota-Nutzung
  models <Sub>    Modellkatalog: list / pricing / groups
  upstream        Zustand der Upstream-Anbieter (Status-Page-Zusammenfassung)
  perf            Performance pro Modell (Erfolgsrate / Latenz / Durchsatz)
  demand <Sub>    Käuferseitige Marketplace-Einträge (list/my/show/submit/cancel/remove)
  dispute <Sub>   Streitfälle öffnen / auflisten / einsehen
  report          Missbrauchs- / TOS-Verstoß-Meldung einreichen
  notify <Sub>    In-App-Benachrichtigungen (list / count / read / readall)
  dm <Sub>        Direktnachrichten (threads / open / send / messages / read)
  seller <Sub>    Verkäuferbefehle des Channel-Marketplaces
__ADMIN_BLOCK__
  edge <Sub>      BYO-GPU-Anbieter-Agent (docker + ollama)
  proxy <Sub>     Lokaler Sanitizer-Proxy (Privatsphäre-Filter für SDK-Anfragen)
  mcp [Sub]       MCP-Server für KI-CLIs (Claude Code / Codex / Gemini)
  doctor          Selbsttest (Anmeldedaten, Gateway, Sanitizer, Tools)
  events          Live-Event-Stream abonnieren (SSE)
  settings        CLI-Einstellungen anzeigen / ändern (Sprache, …)
  update          Auf neuere Version prüfen und das passende Upgrade ausführen
  version         Build-Version ausgeben
  help            Diese Meldung anzeigen

Führe 'everyapi <Befehl> help' für Details und Optionen der Unterbefehle aus
(z. B. 'everyapi seller help', 'everyapi edge help').
'''
usage_admin_block = '''  admin <Sub>     Operator-Befehle (admin-Rolle erforderlich)
'''

