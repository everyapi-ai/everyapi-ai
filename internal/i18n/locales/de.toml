Meldet für jeden bekannten Client (claude / codex / gemini) einen von:
  registered      — everyapi ist in der MCP-Serverliste dieses Clients eingetragen
  not registered  — Client ist installiert, aber der Server ist noch nicht hinzugefügt
  not on PATH     — Client-Binary ist gar nicht installiert
  (probe failed)  — Client-Binary existiert, aber `mcp list` ist fehlgeschlagen
'''

