[edge.usage]
missing_subcommand = "Unterbefehl fehlt (versuche 'everyapi edge help')"
unknown_subcommand = "unbekannter 'edge'-Unterbefehl %q"
text = """everyapi edge — BYO-GPU-Anbieter-Agent

VERWENDUNG
  everyapi edge <Unterbefehl> [Optionen]

UNTERBEFEHLE
  register [--name N] [--country CC] [--attach-to-channel ID]
        Legt im EveryAPI-Backend einen Knoten + Registrierungstoken an und
        speichert sie unter ~/.local/share/everyapi/edge/<node-id>/.
        Nutzt deinen cli-Login wieder (kein separates Einfügen des Tokens).
        Mit --attach-to-channel den Knoten als Geschwister an einen
        bestehenden Edge-Kanal anhängen (Multi-Node-Load-Balancing).

  list   (Alias: ls)
        Zeigt alle Knoten des angemeldeten Nutzers im aktuellen Backend,
        mit api_base und Konto-id oben — praktisch, wenn das
        Verkäufer-Dashboard nichts anzeigt und du prüfen willst, mit
        welchem Backend / Konto die CLI tatsächlich spricht.

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        Erkennt die GPU-Hardware, erzeugt docker-compose.yml im workdir des
        Knotens und führt dann 'docker compose up -d' aus. Beim ersten Mal
        werden die Images ollama + agent geladen. --mode auto ist die
        Vorgabe (nvidia-smi → nvidia, rocminfo → rocm, Darwin arm64 →
        macos, sonst → cpu).

  status [--node ID]
        Zeigt 'docker compose ps' neben der Knotenansicht des Dashboards
        (online / offline / pausiert, zuletzt gesehen, aktuelle Modelle).

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d

  rename --name NEW [--country CC] [--region R] [--clear-location] [--node ID]
        PUT /api/seller/edge/nodes/:id mit neuem Namen und/oder Standort.
        Der gepaarte Kanalname wird in derselben Transaktion synchronisiert.

  pause  [--node ID]                 Den gepaarten Kanal manuell deaktivieren
                                     (klebrig, übersteht Reconnects). Käufer-
                                     Traffic wird hier nicht mehr geroutet.
  resume [--node ID]                 Manuelle Deaktivierung aufheben. Der
                                     Kanal nimmt am Routing teil, sobald der
                                     nächste Heartbeat des Agents ankommt.

  remove [--node ID] [--keep-backend]
        docker compose down -v + löscht das lokale workdir. Ruft außerdem
        DELETE /api/seller/edge/nodes/<id> im Backend auf, sofern nicht
        --keep-backend gesetzt ist (nützlich, wenn ein Knoten auf eine
        andere Maschine umgezogen wird).

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        Kapselt 'docker compose exec ollama ollama <op>'.

  help
        Gibt diese Meldung aus.

ERSTER START
  $ everyapi login                    # falls noch nicht
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

VORAUSSETZUNGEN
  - docker + docker compose v2 im PATH
  - Linux/Windows: NVIDIA Container Toolkit (für den nvidia-Modus) ODER
    ROCm 5.7+ (für den rocm-Modus)
  - macOS (Apple Silicon): natives 'brew install ollama && brew services
    start ollama' — Metal-Beschleunigung ist über docker nicht verfügbar
"""

