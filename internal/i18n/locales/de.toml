install_usage = '''everyapi mcp install — everyapi als MCP-Server in einem KI-CLI registrieren

VERWENDUNG
  everyapi mcp install [Client]

ARGUMENTE
  Client    Einer von: claude, codex, gemini. Standard ist claude.

Führt intern `<Client> mcp add everyapi everyapi mcp` aus (mit der
Syntax, die der jeweilige Client erwartet). Danach startet dein KI-CLI
`everyapi mcp` bei Bedarf und stellt die vier everyapi_*-Tools
(status, topup, seller_list, seller_withdraw) bereit.

Erfordert das CLI des gewählten Clients im PATH. Falls es nicht
installiert ist, enthält die Fehlermeldung den Installationslink und
ein Konfigurations-Snippet, das du von Hand in die Client-Einstellungen
einfügen kannst.'''
uninstall_usage = '''everyapi mcp uninstall — everyapi aus einem KI-CLI entfernen

VERWENDUNG
  everyapi mcp uninstall [Client]

ARGUMENTE
  Client    Einer von: claude, codex, gemini. Standard ist claude.

Führt intern `<Client> mcp remove everyapi` aus und macht damit
rückgängig, was `everyapi mcp install [Client]` getan hat. Starte den
Client danach neu, um den laufenden Server-Prozess zu beenden.

Erfordert das CLI des gewählten Clients im PATH. Falls du everyapi
durch manuelles Bearbeiten der Client-Einstellungen registriert hast,
entferne den Eintrag "everyapi" aus dem mcpServers-Objekt von Hand.'''
status_usage = '''everyapi mcp status — zeigen, welche MCP-Clients everyapi registriert haben

VERWENDUNG
