# Deutsche Übersetzungen für die eigenen Zeichenketten des CLI.
#
# Neuen Schlüssel hinzufügen: hier UND in en.toml unter dem gleichen
# Pfad ergänzen. Fehlende Schlüssel in de fallen automatisch auf den
# en-Wert zurück; fehlende Schlüssel in BEIDEN geben den nackten
# Schlüssel zurück (lautes Scheitern für den Entwickler).
#
# Mehrzeilige USAGE-Blöcke nutzen TOMLs literale Multiline-Strings
# ('''…'''). Sie interpretieren keine Backslash-Escapes, sodass roher
# Go-Backtick-Text unverändert übernommen werden kann. TOML entfernt
# den Zeilenumbruch direkt nach dem öffnenden ''' — genau wie bei
# Gos raw strings am Zeilenende. Schreibe den Block also linksbündig
# und die Ausgabe beginnt dort, wo der Nutzer es erwartet.
#
# Neue Sprache hinzufügen: einfach eine {lang}.toml in dieses
# Verzeichnis legen; der Loader greift sie in init() auf. Es sind
# außer dem Lang*-const und der Aufnahme in SupportedLanguages keine
# Code-Änderungen nötig.

