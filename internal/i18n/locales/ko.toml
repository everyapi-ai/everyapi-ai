  revoke   <id> [-y]                   토큰 삭제 (소프트 삭제, -y 없으면 확인)
  usage    <key>                       키의 남은 쿼터 표시 (로그인 불필요)

CREATE / UPDATE 플래그
  --name <n>           표시명 (create 필수, 최대 50 자)
  --group <g>          라우팅 그룹 (기본 "" = 자동)
  --unlimited          쿼터 제한 없음 (--quota 무시)
  --quota <int>        남은 쿼터 (게이트웨이 단위, 'everyapi status' 참조)
  --expires <when>     "never" (create 기본) 또는 절대 Unix 초
  --models <a,b,c>     지정 모델 id CSV 로 제한 (미지정 / 빈 값 → 모두)
