[launcher]
welcome = "everyapi — 명령을 선택하세요:"
usage = '''
everyapi — EveryAPI CLI

사용법
  everyapi <command> [flags]

명령
  login           이 기기를 EveryAPI 에 인증
  logout          이 기기의 인증 정보 삭제
  status          현재 쿼터, 사용량, 잔액 표시
  topup           지갑 충전 페이지 열기 (피싱 방지 검증 문구 포함)
  wallet <sub>    결제 내역 / 결제 수단 / 교환 키
  checkin         오늘의 데일리 쿼터 수령
  user <sub>      프로필 / 2FA / passkey / OAuth 연동 / 추천 코드
  subscription <sub>  구독 플랜 / 내 구독 / 결제 설정
  use <tool>      EveryAPI 를 통해 서드파티 CLI 실행 (claude / codex / gemini)
  token <sub>     릴레이 API 토큰 관리 (list / show / create / update / key / revoke / usage)
  log <sub>       요청 로그: list / stat / summary
  usage           일별 쿼터 사용량
  models <sub>    모델 카탈로그: list / pricing / groups
  upstream        업스트림 제공자 상태 (상태 페이지 집계)
  perf            모델별 성능 (성공률 / 지연 / 처리량)
  demand <sub>    바이어 측 마켓플레이스 게시 (list/my/show/submit/cancel/remove)
  dispute <sub>   분쟁: 제기 / 목록 / 조회
  report          어뷰즈 / TOS 위반 신고
  notify <sub>    앱 내 알림 (list / count / read / readall)
  dm <sub>        다이렉트 메시지 (threads / open / send / messages / read)
  seller <sub>    채널 마켓플레이스 셀러 명령
__ADMIN_BLOCK__
  edge <sub>      BYO-GPU 공급자 에이전트 (docker + ollama)
  proxy <sub>     로컬 새너타이저 프록시 (SDK 요청 프라이버시 필터)
  mcp [sub]       AI CLI 용 MCP 서버 (Claude Code / Codex / Gemini)
  doctor          자가 진단 (인증 정보, 게이트웨이, 새너타이저, 도구)
  events          라이브 이벤트 스트림 구독 (SSE)
  settings        CLI 환경설정 조회 / 변경 (언어 등)
  update          새 릴리스 확인 후 해당 업그레이드 실행
  version         빌드 버전 출력
  help            이 메시지 표시

하위 명령의 상세와 플래그는 'everyapi <command> help' 로 확인
(예: 'everyapi seller help', 'everyapi edge help').
'''
usage_admin_block = '''  admin <sub>     운영 명령 (admin 역할 필요)
'''

