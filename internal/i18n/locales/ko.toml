# CLI 자체 문자열에 대한 한국어 번역.
#
# 새 키 추가: 같은 경로로 en.toml 에도 추가해야 함. 여기에 없는
# 키는 자동으로 en.toml 값으로 대체되며, 양쪽 모두에 없으면 키
# 자체가 반환됨 (개발자에게 즉시 보이는 실패).
#
# 여러 줄 USAGE 블록은 TOML 의 리터럴 멀티라인 문자열 ('''…''')
# 을 사용함. 백슬래시 이스케이프를 해석하지 않으므로 Go raw 문자열을
# 그대로 옮길 수 있음. TOML 은 ''' 직후의 줄바꿈을 제거하므로
# 블록을 왼쪽 끝에 맞춰 작성하면 예상한 위치에서 출력됨.
#
# 새 언어 추가: 이 디렉터리에 {lang}.toml 을 추가하면 init() 이
# 자동으로 로드함. SupportedLanguages 에 포함되려면 Lang* 상수만
# 추가하면 되고 다른 코드 변경은 필요 없음.

