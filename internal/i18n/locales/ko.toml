everyapi token — 릴레이 API 토큰 관리 (앱에 임베드하는 키)

사용법
  everyapi token <subcommand> [flags]

하위 명령
  list                                 토큰 목록 (마스킹된 키)
  show     <id>                        토큰 상세
  key      <id>                        평문 전체 키 출력
  create   --name <n> [flags]          새 토큰 발급
