text = """everyapi edge — BYO-GPU 공급자 에이전트

사용법
  everyapi edge <서브커맨드> [플래그]

서브커맨드
  register [--name N] [--country CC]
        EveryAPI 백엔드에 노드 + 등록 토큰을 생성하고
        ~/.local/share/everyapi/edge/<node-id>/ 에 저장합니다. cli
        로그인을 재사용합니다 (별도 토큰 붙여넣기 불필요).

  list   (별칭: ls)
        현재 백엔드에서 로그인한 사용자가 소유한 모든 노드를 출력하며,
        상단에 api_base 와 계정 id 를 표시합니다 — 셀러 대시보드에
        아무것도 표시되지 않을 때 CLI 가 실제로 어떤 백엔드 / 계정에
        연결되어 있는지 확인하는 데 유용합니다.

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        GPU 하드웨어를 감지하고 노드의 workdir 에 docker-compose.yml 을
        생성한 다음 'docker compose up -d' 를 실행합니다. 처음에는
        ollama + agent 이미지를 받습니다. 기본값은 --mode auto
        (nvidia-smi → nvidia, rocminfo → rocm, Darwin arm64 → macos,
        그 외 → cpu).

  status [--node ID]
        대시보드의 노드 보기 (온라인 / 오프라인 / 일시중지, 마지막 접속,
        현재 모델) 옆에 'docker compose ps' 를 표시합니다.

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d
  remove [--node ID] [--keep-backend]
        docker compose down -v + 로컬 workdir 삭제. --keep-backend 가
        설정되지 않으면 백엔드의 DELETE /api/seller/edge/nodes/<id> 도
        호출합니다 (노드를 다른 머신으로 옮길 때 유용).

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        'docker compose exec ollama ollama <op>' 를 래핑합니다.

  help
        이 메시지를 출력합니다.

첫 실행
  $ everyapi login                    # 아직 안 했다면
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

요구 사항
  - PATH 에 docker + docker compose v2
  - Linux/Windows: NVIDIA Container Toolkit (nvidia 모드) 또는
    ROCm 5.7+ (rocm 모드)
  - macOS (Apple Silicon): 네이티브 'brew install ollama && brew services
    start ollama' — Metal 가속은 docker 를 통해 사용할 수 없습니다
"""

