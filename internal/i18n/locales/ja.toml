# CLI 自身の文字列に対する日本語訳。
#
# 新しいキーを追加する場合: en.toml にも同じパスで追加すること。
# ここに無いキーは自動で en.toml の値にフォールバックする。両方に
# 無い場合はキー自体が返る（開発者向けの明示的な失敗）。
#
# 複数行の USAGE ブロックは TOML のリテラル複数行文字列 ('''…''')
# を使う。バックスラッシュエスケープを解釈しないため、Go の raw
# 文字列をそのまま貼り付け可能。TOML は ''' 直後の改行を取り除く
# ため、ブロックは左端揃えで書けば期待どおりに出力される。
#
# 新しい言語を追加する場合: このディレクトリに {lang}.toml を置く
# だけで init() がロードする。SupportedLanguages に含めるため
# Lang* 定数を追加する以外はコード変更不要。

