usage = '''
everyapi token — リレー API トークン管理（アプリに埋め込むキー）

使用法
  everyapi token <subcommand> [flags]

サブコマンド
  list                                 トークン一覧（キーはマスク表示）
  show     <id>                        単一トークンの詳細
  key      <id>                        プレーンテキストの完全なキーを表示
  create   --name <n> [flags]          新規トークンを作成
  update   <id> [flags]                トークンの項目を編集（フラグ未指定 → 現状維持）
  enable   <id>                        状態を有効に切り替え
  disable  <id>                        状態を無効に切り替え
  revoke   <id> [-y]                   トークンを削除（ソフトデリート、-y なしで確認）
  usage    <key>                       キーの残りクォータを表示（ログイン不要）

CREATE / UPDATE フラグ
  --name <n>           表示名 (create で必須、最大 50 文字)
  --group <g>          ルーティンググループ (デフォルト "" = 自動)
  --unlimited          クォータ無制限 (--quota を上書き)
  --quota <int>        残りクォータ (ゲートウェイ単位、'everyapi auth status' 参照)
  --expires <when>     "never" (create のデフォルト) または絶対 Unix 秒
  --models <a,b,c>     指定モデル id の CSV に制限 (未指定 / 空 → すべて)
  --ip <cidr,cidr>     IP 許可リスト (未指定 → 制限なし)
  --cross-group        自動ルーティングのグループ越え再試行を許可

例
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  (sk-everyapi-… を表示)
  everyapi token revoke 42 -y
'''

