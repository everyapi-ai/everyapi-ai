[edge.usage]
missing_subcommand = "サブコマンドがありません（'everyapi edge help' を試してください）"
unknown_subcommand = "不明な 'edge' サブコマンド %q"
text = """everyapi edge — BYO-GPU サプライヤーエージェント

使い方
  everyapi edge <サブコマンド> [フラグ]

サブコマンド
  register [--name N] [--country CC]
        EveryAPI バックエンドにノード + 登録トークンを作成し、
        ~/.local/share/everyapi/edge/<node-id>/ に保存します。cli の
        ログインを再利用します（トークンの貼り付けは不要）。

  list   (エイリアス: ls)
        現在のバックエンドでログインユーザーが所有するすべてのノードを
        表示し、先頭に api_base とアカウント id を出します — セラー
        ダッシュボードが何も表示しないとき、CLI が実際にどのバックエンド /
        アカウントに接続しているか確認するのに便利です。

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        GPU ハードウェアを検出し、ノードの workdir に docker-compose.yml を
        生成して 'docker compose up -d' します。初回は ollama + agent
        イメージを取得します。既定は --mode auto（nvidia-smi → nvidia、
        rocminfo → rocm、Darwin arm64 → macos、それ以外 → cpu）。

  status [--node ID]
        ダッシュボードのノードビュー（オンライン / オフライン / 一時停止、
        最終接続、現在のモデル）の隣に 'docker compose ps' を表示します。

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d
  remove [--node ID] [--keep-backend]
        docker compose down -v + ローカル workdir を削除します。
        --keep-backend を指定しない限り、バックエンドの
        DELETE /api/seller/edge/nodes/<id> も呼びます（ノードを別の
        マシンに付け替えるときに便利）。

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        'docker compose exec ollama ollama <op>' をラップします。

  help
        このメッセージを表示します。

初回実行
  $ everyapi login                    # まだの場合
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

要件
  - PATH 上に docker + docker compose v2
  - Linux/Windows: NVIDIA Container Toolkit（nvidia モード）または
    ROCm 5.7+（rocm モード）
  - macOS（Apple Silicon）: ネイティブの 'brew install ollama && brew
    services start ollama' — Metal アクセラレーションは docker 経由では
    使えません
"""

