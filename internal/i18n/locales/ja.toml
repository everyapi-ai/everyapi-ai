[admin.help]
usage = '''
everyapi admin — 運用コマンド（管理者専用）

使用法
  everyapi admin <subcommand> [flags]

サブコマンド
  marketplace status     現在の marketplace.enabled フラグを表示
  marketplace on         マーケットを開く（自前 GPU + 販売者フロー）
  marketplace off        閉じる；稼働中ノードは継続
  user search <keyword>  ユーザー名 / メール / 表示名で曖昧検索
  user show <id>         ユーザー 1 件
  user list [--page P]   ページングされたユーザー一覧
  user manage <id> --action enable|disable|delete|promote_admin|demote_admin
                         状態/ロール操作を適用（権限は後端で検証）
  channel test <id>      チャネルを 1 件ヘルスチェック
  channel tag <name> --enable|--disable
                         タグの付いた全チャネルを一括切替
  log tail [--user U] [--model M] [--channel C] [--group G] [--since W]
                         ページング管理ログ検索
  abuse list [--status]  提出済みの通報
  abuse show <id>        通報 1 件
  abuse update <id> --status X [--note N]
                         通報を処理
  audit [--page P]       最近の管理監査ログ
  redemption list|search <kw>|show <id>|create --name N --quota Q [--count C] [--expires E]
             |update <id>|status <id> enable|disable|delete <id>|clear-invalid
                         前払いクォータ引き換えコードを管理（作成時にキーを生成・表示）
  help                   このヘルプを表示

認証：'everyapi auth login' のトークンを再利用。後端で管理者である必要あり（非管理者は 403）。

すべての操作はダッシュボードと同じ監査ログに記録されます。
'''
