[launcher]
usage_header = "everyapi — EveryAPI CLI\n\n使用法\n  everyapi <コマンド> [引数]"
usage_footer = "\n各コマンドのサブコマンド・フラグは 'everyapi <コマンド> help' で確認できます。"
welcome = "everyapi — コマンドを選択してください:"
pick_category = "everyapi — カテゴリを選択してください:"
nav_hint = "↑/↓ 選択 · enter 決定 · esc 戻る"
usage = '''
everyapi — EveryAPI CLI

使用法
  everyapi <command> [flags]

コマンド
  login           この端末を EveryAPI に認証
  logout          この端末の認証情報を削除
  status          現在のクォータ、使用量、残高を表示
  topup           ウォレット入金ページを開く（フィッシング対策フレーズあり）
  wallet <sub>    支払い履歴 / 支払い方法 / 引換キー
  checkin         本日のデイリー付与クォータを受領
  user <sub>      プロフィール / 2FA / passkey / OAuth 連携 / アフィリエイトコード
  subscription <sub>  サブスクリプションプラン / 自分の契約 / 課金設定
  use <tool>      EveryAPI 経由でサードパーティ CLI を起動 (claude / codex / gemini / hermes)
  token <sub>     リレー API トークン管理 (list / show / create / update / key / revoke / usage)
  log <sub>       リクエストログ: list / stat / summary
  usage           日別のクォータ使用量
  models <sub>    モデルカタログ: list / pricing / groups
  upstream        上流プロバイダの稼働状況 (ステータスページ集計)
  perf            モデル別パフォーマンス (成功率 / レイテンシ / スループット)
  demand <sub>    バイヤー側マーケットプレイス投稿 (list/my/show/submit/cancel/remove)
  dispute <sub>   ディスピュート: 起票 / 一覧 / 詳細
  report          不正利用 / 規約違反を報告
  notify <sub>    アプリ内通知 (list / count / read / readall)
  dm <sub>        ダイレクトメッセージ (threads / open / send / messages / read)
  seller <sub>    チャネルマーケットプレイスのセラー向けコマンド
__ADMIN_BLOCK__
  edge <sub>      BYO-GPU サプライヤーエージェント (docker + ollama)
  proxy <sub>     ローカルサニタイザプロキシ (SDK リクエストのプライバシーフィルタ)
  mcp [sub]       AI CLI 向け MCP サーバー (Claude Code / Codex / Gemini)
  doctor          セルフチェック（認証情報、ゲートウェイ、サニタイザ、ツール）
  events          ライブイベントストリームを購読 (SSE)
  settings        CLI 設定を表示 / 変更（言語など）
  update          新しいリリースを確認し、対応するアップグレードを実行
  version         ビルドバージョンを表示
  help            このメッセージを表示

サブコマンドの詳細とフラグは 'everyapi <command> help' を参照
（例: 'everyapi seller help'、'everyapi edge help'）。
'''
usage_admin_block = '''  admin <sub>     運用コマンド（admin ロールが必要）
'''

