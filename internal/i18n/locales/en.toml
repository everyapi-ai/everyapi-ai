[mcp]
install_usage = '''everyapi mcp install — register everyapi as an MCP server with an AI CLI

USAGE
  everyapi mcp install [client]

ARGUMENTS
  client    One of: claude, codex, gemini. Defaults to claude.

Runs `<client> mcp add everyapi everyapi mcp` under the hood (with the
syntax each client expects). After this your AI CLI spawns `everyapi mcp`
on demand, exposing the four everyapi_* tools (status, topup, seller_list,
seller_withdraw).

Requires the chosen client's CLI on PATH. If it isn't installed, the
error message includes the install link and a config snippet you can
paste into the client's settings by hand.'''
uninstall_usage = '''everyapi mcp uninstall — unregister everyapi from an AI CLI

USAGE
  everyapi mcp uninstall [client]

ARGUMENTS
  client    One of: claude, codex, gemini. Defaults to claude.

Runs `<client> mcp remove everyapi` under the hood, undoing what
`everyapi mcp install [client]` did. Restart the client afterward to
drop the running server process.

Requires the chosen client's CLI on PATH. If you registered everyapi by
hand-editing the client's settings, remove the "everyapi" entry from the
mcpServers object manually.'''
status_usage = '''everyapi mcp status — show which MCP clients have everyapi registered

USAGE
  everyapi mcp status

Reports for each known client (claude / codex / gemini) one of:
  registered      — everyapi is wired into this client's MCP server list
  not registered  — client is installed but the server isn't added yet
  not on PATH     — client binary not installed at all
  (probe failed)  — client binary exists but `mcp list` errored
'''

