# English translations for the CLI's own strings.
#
# Adding a new key: add it here AND in zh.toml at the same path.
# Missing keys in zh fall back to the en value automatically; missing
# keys in BOTH return the bare key (loud failure for the developer).
#
# Multi-line USAGE blocks use TOML's literal multiline strings
# ('''…'''). They don't interpret backslash escapes, so raw Go
# backtick text drops in unchanged. TOML strips the newline that
# immediately follows the opening ''' — matching how Go raw strings
# behave when the backtick sits at end-of-line — so write the block
# flush-left and the rendered output starts where the user expects.
#
# Adding a new language: drop a {lang}.toml in this directory; the
# loader picks it up at init(). No code changes needed besides adding
# the Lang* const + including it in SupportedLanguages.

