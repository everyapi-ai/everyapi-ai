everyapi — EveryAPI CLI

USAGE
  everyapi <command> [flags]

COMMANDS
  **auth** <sub>      Sign in / out, session status
  **wallet** <sub>    **Payment** history / methods / redemption keys
  **account** <sub>   Profile · 2FA · subscription · billing
  **stats** <sub>   Usage · logs · perf · upstream
