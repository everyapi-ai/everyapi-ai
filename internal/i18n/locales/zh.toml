[admin.help]
usage = '''
everyapi admin — 运维命令（仅管理员）

用法
  everyapi admin <subcommand> [flags]

子命令
  marketplace status     查看当前 marketplace.enabled 开关
  marketplace on         开启市场（自带 GPU + 卖家流程）
  marketplace off        关闭市场；运行中的节点继续运行
  user search <keyword>  按用户名 / 邮箱 / 显示名模糊查找
  user show <id>         单条用户记录
  user list [--page P]   分页用户列表
  user manage <id> --action enable|disable|delete|promote_admin|demote_admin
                         应用状态/角色操作（后端校验权限）
  channel test <id>      健康检查单个渠道
  channel tag <name> --enable|--disable
                         按标签批量翻转所有渠道
  log tail [--user U] [--model M] [--channel C] [--group G] [--since W]
                         分页管理日志检索
  abuse list [--status]  已提交的举报
  abuse show <id>        单条举报
  abuse update <id> --status X [--note N]
                         处置一条举报
  audit [--page P]       近期管理审计日志
  redemption list|search <kw>|show <id>|create --name N --quota Q [--count C] [--expires E]
             |update <id>|status <id> enable|disable|delete <id>|clear-invalid
                         管理预付额度兑换码（创建即生成并打印密钥）
  help                   打印本帮助

鉴权：复用你 'everyapi auth login' 的令牌；后端须为管理员（非管理员返回 403）。

所有操作都会写入与面板相同的审计日志。
'''

