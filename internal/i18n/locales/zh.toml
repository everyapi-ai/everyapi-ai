[launcher]
welcome = "everyapi — 选一个命令："
usage = '''
everyapi — EveryAPI 命令行

用法
  everyapi <命令> [参数]

命令
  login           登录此设备到 EveryAPI
  logout          清除本设备凭证
  status          显示当前额度、用量与余额
  topup           打开钱包充值页（反钓鱼校验短语）
  wallet <子>     充值历史 / 支付方式 / 兑换码
  checkin         领取今日签到额度
  user <子>       个人信息 / 2FA / passkey / OAuth 绑定 / 推广码
  subscription <子>  订阅计划 / 我的订阅 / 计费偏好
  use <工具>      通过 EveryAPI 启动第三方 CLI（claude / codex / gemini）
  token <子>      管理 relay API token（list / show / create / update / key / revoke / usage）
  log <子>        请求日志：list / stat / summary
  usage           按日用量
  models <子>     模型目录：list / pricing / groups
  upstream        上游提供商健康状态（状态页汇总）
  perf            按模型性能（成功率 / 时延 / 吞吐）
  demand <子>     买方需求贴（list/my/show/submit/cancel/remove）
  dispute <子>    争议：开启 / 列表 / 查看
  report          举报滥用 / 违规
  notify <子>     站内通知（list / count / read / readall）
  dm <子>         私信（threads / open / send / messages / read）
  seller <子>     卖方频道市场命令
__ADMIN_BLOCK__
  edge <子>       自带 GPU 供应商代理（docker + ollama）
  proxy <子>      本地脱敏代理（SDK 请求隐私过滤）
  mcp [子]        AI CLI 的 MCP 服务器（Claude Code / Codex / Gemini）
  doctor          本机自检（凭证、网关、代理、工具）
  events          订阅实时事件流（SSE）
  settings        查看 / 修改 CLI 偏好（语言等）
  update          检查并安装新版本
  version         打印构建版本
  help            显示本说明

运行 'everyapi <命令> help' 查看子命令详情与参数
（如 'everyapi seller help'、'everyapi edge help'）。
'''
usage_admin_block = '''  admin <子>      运维命令（需要管理员角色）
'''

