everyapi tmux — `everyapi use` 留下的那些 tmux 会话

用法
  everyapi tmux                      列出全部托管会话
  everyapi tmux list [--format=json] 只列出，不连接
  everyapi tmux attach [<会话名>]     连接到某个会话（省略则进入选择界面）
