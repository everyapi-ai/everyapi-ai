[edge.usage]
missing_subcommand = "缺少子命令（试试 'everyapi edge help'）"
unknown_subcommand = "未知的 'edge' 子命令 %q"
text = """everyapi edge —— BYO-GPU 供给方代理

用法
  everyapi edge <子命令> [参数]

子命令
  register [--name N] [--country CC] [--attach-to-channel ID]
        在 EveryAPI 后端创建一个节点 + 注册令牌，并持久化到
        ~/.local/share/everyapi/edge/<node-id>/。复用你的 cli 登录
        （无需单独粘贴令牌）。用 --attach-to-channel 把节点挂到已存在
        的 edge 频道下做多节点分流，省去新建频道。

  list   (别名：ls)
        列出当前后端上登录用户拥有的所有节点，顶部显示 api_base 和账户
        id —— 当卖家面板什么都不显示、你想确认 CLI 实际连的是哪个后端 /
        账户时很有用。

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        检测 GPU 硬件，把 docker-compose.yml 渲染到节点 workdir，然后
        'docker compose up -d'。首次运行会拉取 ollama + agent 镜像。
        默认 --mode auto（nvidia-smi → nvidia，rocminfo → rocm，
        Darwin arm64 → macos，否则 → cpu）。

  status [--node ID]
        在面板视图旁显示 'docker compose ps'（在线 / 离线 / 已暂停、
        最后在线时间、当前模型）。

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d

  rename --name NEW [--country CC] [--region R] [--clear-location] [--node ID]
        PUT /api/seller/edge/nodes/:id，更新名称和/或位置。同事务里
        会同步配对频道的名称。

  pause  [--node ID]                 手动停用配对频道（粘性，跨重连保留）。
                                     买家流量停止路由到这里。
  resume [--node ID]                 解除手动停用。下次 agent 心跳后频道
                                     重新加入分流。

  remove [--node ID] [--keep-backend]
        docker compose down -v + 删除本地 workdir。除非设置
        --keep-backend，否则还会调用后端的
        DELETE /api/seller/edge/nodes/<id>（在把节点重新指向另一台机器
        时很有用）。

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        封装 'docker compose exec ollama ollama <op>'。

  help
        打印本帮助。

首次运行
  $ everyapi auth login                    # 如果还没登录
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

环境要求
  - PATH 上需有 docker + docker compose v2
  - Linux/Windows：NVIDIA Container Toolkit（nvidia 模式）或
    ROCm 5.7+（rocm 模式）
  - macOS（Apple Silicon）：原生 'brew install ollama && brew services
    start ollama' —— Metal 加速无法通过 docker 使用
"""

