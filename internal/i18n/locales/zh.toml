usage = '''
everyapi token — 管理 relay API token（应用嵌入的 key）

用法
  everyapi token <子命令> [参数]

子命令
  list                                 列出你的 token（key 已脱敏）
  show     <id>                        查看某个 token 的详情
  key      <id>                        打印完整明文 key
  create   --name <n> [参数]           新建 token
  update   <id> [参数]                 编辑 token 字段（不传则保留原值）
  enable   <id>                        启用
  disable  <id>                        禁用
  revoke   <id> [-y]                   删除 token（软删；非 -y 会询问）
  usage    <key>                       查看某个 key 的剩余额度（无需登录）

CREATE / UPDATE 参数
  --name <n>           显示名（create 必填；最长 50 字符）
  --group <g>          路由分组（默认 "" = 自动）
  --unlimited          无额度上限（覆盖 --quota）
  --quota <int>        剩余额度（按网关单位；见 'everyapi status'）
  --expires <when>     "never"（create 默认）或绝对 Unix 秒
  --models <a,b,c>     限制为这些模型 id 的 CSV（不传 / 空 → 全部）
  --ip <cidr,cidr>     IP 白名单（不传 → 不限制）
  --cross-group        允许自动路由跨分组重试

示例
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  （打印 sk-everyapi-…）
  everyapi token revoke 42 -y
'''

