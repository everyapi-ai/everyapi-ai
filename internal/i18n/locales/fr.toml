[admin.help]
usage = '''
everyapi admin — commandes d'opérateur (admin uniquement)

UTILISATION
  everyapi admin <subcommand> [flags]

SOUS-COMMANDES
  marketplace status     Affiche l'indicateur marketplace.enabled actuel
  marketplace on         Ouvrir la marketplace (BYO-GPU + flux vendeur)
  marketplace off        La fermer ; les nœuds actifs continuent
  user search <keyword>  Recherche floue sur nom / e-mail / nom affiché
  user show <id>         Un enregistrement utilisateur
  user list [--page P]   Liste paginée des utilisateurs
  user manage <id> --action enable|disable|delete|promote_admin|demote_admin
                         Applique une action de statut/rôle (le backend vérifie le rôle)
  channel test <id>      Vérifier l'état d'un canal
  channel tag <name> --enable|--disable
                         Basculer en masse les canaux portant le tag
  log tail [--user U] [--model M] [--channel C] [--group G] [--since W]
                         Recherche paginée du journal
  abuse list [--status]  Signalements déposés
  abuse show <id>        Un signalement
  abuse update <id> --status X [--note N]
                         Traiter un signalement
  audit [--page P]       Entrées récentes du journal d'audit
  redemption list|search <kw>|show <id>|create --name N --quota Q [--count C] [--expires E]
             |update <id>|status <id> enable|disable|delete <id>|clear-invalid
                         Gérer les codes de rachat de quota (la création génère et imprime les clés)
  help                   Afficher ce message

Auth : réutilise le jeton de 'everyapi auth login' ; vous devez être admin sur le backend (sinon 403).

Chaque action est consignée dans le même journal d'audit que le tableau de bord.
'''
