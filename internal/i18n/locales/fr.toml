[edge.usage]
missing_subcommand = "sous-commande manquante (essayez 'everyapi edge help')"
unknown_subcommand = "sous-commande 'edge' inconnue %q"
text = """everyapi edge — agent fournisseur BYO-GPU

UTILISATION
  everyapi edge <sous-commande> [options]

SOUS-COMMANDES
  register [--name N] [--country CC]
        Crée un nœud + un token d'enregistrement sur le backend EveryAPI et
        les enregistre dans ~/.local/share/everyapi/edge/<node-id>/.
        Réutilise votre connexion cli (pas de token à coller).

  list   (alias : ls)
        Affiche tous les nœuds que possède l'utilisateur connecté sur le
        backend actuel, avec api_base et l'id de compte en haut — pratique
        quand le tableau de bord vendeur n'affiche rien et que vous voulez
        confirmer avec quel backend / compte la CLI dialogue réellement.

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        Détecte le matériel GPU, génère docker-compose.yml dans le workdir
        du nœud, puis 'docker compose up -d'. Récupère les images ollama +
        agent la première fois. --mode auto est la valeur par défaut
        (nvidia-smi → nvidia, rocminfo → rocm, Darwin arm64 → macos, sinon
        → cpu).

  status [--node ID]
        Affiche 'docker compose ps' à côté de la vue du nœud dans le
        tableau de bord (en ligne / hors ligne / en pause, dernière
        connexion, modèles actuels).

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d
  remove [--node ID] [--keep-backend]
        docker compose down -v + supprime le workdir local. Appelle aussi
        DELETE /api/seller/edge/nodes/<id> sur le backend sauf si
        --keep-backend est défini (utile pour réaffecter un nœud à une
        autre machine).

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        Encapsule 'docker compose exec ollama ollama <op>'.

  help
        Affiche ce message.

PREMIÈRE EXÉCUTION
  $ everyapi login                    # si ce n'est pas déjà fait
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

PRÉREQUIS
  - docker + docker compose v2 dans le PATH
  - Linux/Windows : NVIDIA Container Toolkit (pour le mode nvidia) OU
    ROCm 5.7+ (pour le mode rocm)
  - macOS (Apple Silicon) : 'brew install ollama && brew services start
    ollama' natif — l'accélération Metal n'est pas disponible via docker
"""

