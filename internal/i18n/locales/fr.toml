# Traductions françaises pour les chaînes propres au CLI.
#
# Pour ajouter une nouvelle clé : l'ajouter ici ET dans en.toml au
# même chemin. Les clés absentes en fr retombent automatiquement sur
# la valeur en ; les clés absentes des DEUX renvoient la clé brute
# (échec bruyant pour le développeur).
#
# Les blocs USAGE multilignes utilisent les chaînes littérales
# multilignes de TOML ('''…'''). Elles n'interprètent pas les
# échappements antislash, donc le texte d'un raw string Go s'y colle
# tel quel. TOML supprime le saut de ligne immédiatement après le '''
# d'ouverture — exactement comme les raw strings Go quand le backtick
# est en fin de ligne — donc écrivez le bloc collé à gauche et la
# sortie commencera là où l'utilisateur s'y attend.
#
# Pour ajouter une nouvelle langue : déposez un {lang}.toml dans ce
# répertoire ; le chargeur le prend en charge à l'init(). Aucun
# changement de code n'est nécessaire au-delà de l'ajout de la
# constante Lang* et de son inclusion dans SupportedLanguages.

