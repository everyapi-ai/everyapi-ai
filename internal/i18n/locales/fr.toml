[launcher]
welcome = "everyapi — choisissez une commande :"
usage = '''
everyapi — CLI EveryAPI

UTILISATION
  everyapi <commande> [options]

COMMANDES
  login           Authentifier cet appareil auprès d'EveryAPI
  logout          Supprimer les identifiants de cet appareil
  status          Afficher quota, utilisation et solde actuels
  topup           Ouvrir la page de rechargement (phrase de vérification anti-phishing)
  wallet <sub>    Historique de paiements / méthodes / clés d'échange
  checkin         Réclamer le quota quotidien d'aujourd'hui
  user <sub>      Profil / 2FA / passkey / liaisons OAuth / code d'affiliation
  subscription <sub>  Plans d'abonnement / mon compte / préférence de facturation
  use <outil>     Lancer un CLI tiers (claude / codex / gemini) via EveryAPI
  token <sub>     Gérer les tokens de relais (list / show / create / update / key / revoke / usage)
  log <sub>       Journal des requêtes : list / stat / summary
  usage           Utilisation de quota jour par jour
  models <sub>    Catalogue de modèles : list / pricing / groups
  upstream        Santé des fournisseurs upstream (synthèse de la page d'état)
  perf            Performance par modèle (taux de succès / latence / débit)
  demand <sub>    Annonces marketplace côté acheteur (list/my/show/submit/cancel/remove)
  dispute <sub>   Ouvrir / lister / consulter des litiges
  report          Déposer un signalement d'abus / violation des CGU
  notify <sub>    Notifications dans l'app (list / count / read / readall)
  dm <sub>        Messages directs (threads / open / send / messages / read)
  seller <sub>    Commandes vendeur du marketplace de canaux
__ADMIN_BLOCK__
  edge <sub>      Agent fournisseur BYO-GPU (docker + ollama)
  proxy <sub>     Proxy de nettoyage local (filtre de confidentialité pour les requêtes SDK)
  mcp [sub]       Serveur MCP pour CLIs d'IA (Claude Code / Codex / Gemini)
  doctor          Auto-vérification (identifiants, gateway, sanitizer, outils)
  events          S'abonner au flux d'événements en direct (SSE)
  settings        Voir / modifier les préférences du CLI (langue, …)
  update          Vérifier une version plus récente et lancer la mise à niveau correspondante
  version         Afficher la version du build
  help            Afficher ce message

Exécutez 'everyapi <commande> help' pour les détails et options des sous-commandes
(par ex. 'everyapi seller help', 'everyapi edge help').
'''
usage_admin_block = '''  admin <sub>     Commandes opérateur (rôle admin requis)
'''

