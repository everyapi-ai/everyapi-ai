usage = '''
everyapi token — gérer les tokens de relais (les clés intégrées à vos apps)

UTILISATION
  everyapi token <sous-commande> [options]

SOUS-COMMANDES
  list                                 Lister vos tokens (clés masquées)
  show     <id>                        Afficher un token en détail
  key      <id>                        Afficher la clé complète en clair
  create   --name <n> [options]        Créer un nouveau token
  update   <id> [options]              Modifier les champs d'un token (option omise → valeur conservée)
  enable   <id>                        Passer le statut à activé
  disable  <id>                        Passer le statut à désactivé
  revoke   <id> [-y]                   Supprimer un token (soft-delete ; demande sauf avec -y)
  usage    <key>                       Afficher le quota restant d'une clé (sans connexion)

OPTIONS CREATE / UPDATE
  --name <n>           Nom affiché (requis à la création ; max 50 caractères)
  --group <g>          Groupe de routage (par défaut "" = auto)
  --unlimited          Aucune limite de quota (écrase --quota)
  --quota <int>        Quota restant (en unités gateway ; voir 'everyapi status')
  --expires <quand>    "never" (par défaut à la création) ou secondes Unix absolues
  --models <a,b,c>     Restreindre à ce CSV d'ids de modèles (omis / vide → tous)
  --ip <cidr,cidr>     Liste blanche d'IP (omis → aucune restriction)
  --cross-group        Autoriser le routage auto à réessayer entre groupes

EXEMPLES
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  (affiche sk-everyapi-…)
  everyapi token revoke 42 -y
'''

