usage = '''
everyapi token — gestionar tokens de relay (las claves que tus apps embeben)

USO
  everyapi token <subcomando> [opciones]

SUBCOMANDOS
  list                                 Listar tus tokens (claves enmascaradas)
  show     <id>                        Mostrar un token en detalle
  key      <id>                        Imprimir la clave completa en texto plano
  create   --name <n> [opciones]       Acuñar un nuevo token
  update   <id> [opciones]             Editar campos del token (omitir una opción → mantener actual)
  enable   <id>                        Cambiar estado a habilitado
  disable  <id>                        Cambiar estado a deshabilitado
  revoke   <id> [-y]                   Eliminar un token (soft-delete; pregunta salvo con -y)
  usage    <key>                       Mostrar la cuota restante de una clave (sin necesidad de login)

OPCIONES DE CREATE / UPDATE
  --name <n>           Nombre para mostrar (obligatorio en create; máx. 50 caracteres)
  --group <g>          Grupo de enrutado (por defecto "" = automático)
  --unlimited          Sin tope de cuota (anula --quota)
  --quota <int>        Cuota restante (en unidades de gateway; ver 'everyapi auth status')
  --expires <cuándo>   "never" (por defecto en create) o segundos Unix absolutos
  --models <a,b,c>     Restringir a este CSV de ids de modelo (omitir / vacío → todos)
  --ip <cidr,cidr>     Lista blanca de IPs (omitir → sin restricción)
  --cross-group        Permitir que el auto-enrutado reintente entre grupos

EJEMPLOS
  everyapi token list
  everyapi token create --name prod --unlimited
  everyapi token create --name byteplus-only --quota 1000000 --group byteplus
  everyapi token update 42 --name renamed
  everyapi token disable 42
  everyapi token key 42                  (imprime sk-everyapi-…)
  everyapi token revoke 42 -y
'''

