[edge.usage]
missing_subcommand = "falta el subcomando (prueba 'everyapi edge help')"
unknown_subcommand = "subcomando 'edge' desconocido %q"
text = """everyapi edge — agente proveedor BYO-GPU

USO
  everyapi edge <subcomando> [opciones]

SUBCOMANDOS
  register [--name N] [--country CC] [--attach-to-channel ID]
        Crea un nodo + token de registro en el backend de EveryAPI y los
        guarda en ~/.local/share/everyapi/edge/<node-id>/. Reutiliza tu
        sesión de cli (sin pegar otro token). Usa --attach-to-channel
        para adjuntar el nodo a un canal edge existente (balanceo
        multi-nodo) en lugar de auto-crear uno.

  list   (alias: ls)
        Muestra todos los nodos que posee el usuario conectado en el
        backend actual, con api_base e id de cuenta arriba — útil cuando
        el panel del vendedor no muestra nada y quieres confirmar con qué
        backend / cuenta habla realmente la CLI.

  start  [--mode auto|nvidia|rocm|macos|cpu] [--node ID] [--gateway URL]
        Detecta el hardware GPU, genera docker-compose.yml en el workdir
        del nodo y luego 'docker compose up -d'. La primera vez descarga
        las imágenes de ollama + agent. --mode auto es el valor por
        defecto (nvidia-smi → nvidia, rocminfo → rocm, Darwin arm64 →
        macos, en otro caso → cpu).

  status [--node ID]
        Muestra 'docker compose ps' junto a la vista del nodo en el panel
        (en línea / fuera de línea / pausado, última conexión, modelos
        actuales).

  stop   [--node ID]                 docker compose down
  logs   [-f|--follow] [--node ID]   docker compose logs
  update [--node ID]                 docker compose pull && up -d

  rename --name NEW [--country CC] [--region R] [--clear-location] [--node ID]
        PUT /api/seller/edge/nodes/:id con el nuevo nombre y/o ubicación.
        El nombre del canal emparejado se sincroniza en la misma
        transacción.

  pause  [--node ID]                 Desactiva manualmente el canal emparejado
                                     (persistente, sobrevive a reconexiones).
                                     El tráfico de compradores deja de
                                     enrutarse aquí.
  resume [--node ID]                 Limpia la desactivación manual. El canal
                                     vuelve a la rotación cuando llegue el
                                     próximo heartbeat del agente.

  remove [--node ID] [--keep-backend]
        docker compose down -v + elimina el workdir local. También llama a
        DELETE /api/seller/edge/nodes/<id> en el backend a menos que se
        use --keep-backend (útil al reasignar un nodo a otra máquina).

  models list  [--node ID]
  models pull  <model> [--node ID]
  models rm    <model> [--node ID]
        Envuelve 'docker compose exec ollama ollama <op>'.

  help
        Imprime este mensaje.

PRIMERA EJECUCIÓN
  $ everyapi auth login                    # si aún no lo hiciste
  $ everyapi edge register --name "rtx-4090-tokyo"
  $ everyapi edge start
  $ everyapi edge models pull llama3.1:8b

REQUISITOS
  - docker + docker compose v2 en el PATH
  - Linux/Windows: NVIDIA Container Toolkit (para el modo nvidia) o
    ROCm 5.7+ (para el modo rocm)
  - macOS (Apple Silicon): 'brew install ollama && brew services start
    ollama' nativo — la aceleración Metal no está disponible vía docker
"""

