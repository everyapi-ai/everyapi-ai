  logout          Eliminar las credenciales de este dispositivo
  status          Mostrar cuota, uso y saldo actuales
  topup           Abrir la página de recarga (con frase anti-phishing)
  wallet <sub>    Historial de pagos / métodos / claves de canje
  checkin         Reclamar la cuota diaria de hoy
  user <sub>      Perfil / 2FA / passkey / vínculos OAuth / código de afiliado
  subscription <sub>  Planes de suscripción / mi cuenta / preferencia de facturación
  use <herr>      Iniciar un CLI de terceros (claude / codex / gemini / hermes) vía EveryAPI
  token <sub>     Gestionar tokens de relay (list / show / create / update / key / revoke / usage)
  log <sub>       Registro de peticiones: list / stat / summary
  usage           Uso de cuota por día
  models <sub>    Catálogo de modelos: list / pricing / groups
  upstream        Salud de los proveedores upstream (resumen de status-page)
  perf            Rendimiento por modelo (tasa de éxito / latencia / throughput)
  demand <sub>    Publicaciones del marketplace del lado comprador (list/my/show/submit/cancel/remove)
  dispute <sub>   Abrir / listar / inspeccionar disputas
  report          Presentar un reporte de abuso / violación de TOS
  notify <sub>    Notificaciones en la app (list / count / read / readall)
  dm <sub>        Mensajes directos (threads / open / send / messages / read)
  seller <sub>    Comandos de vendedor del marketplace de canales
__ADMIN_BLOCK__
  edge <sub>      Agente proveedor BYO-GPU (docker + ollama)
  proxy <sub>     Proxy sanitizador local (filtro de privacidad para peticiones SDK)
  mcp [sub]       Servidor MCP para CLIs de IA (Claude Code / Codex / Gemini)
  doctor          Auto-chequeo (credenciales, gateway, sanitizador, herramientas)
  events          Suscribirse al stream de eventos en vivo (SSE)
  settings        Ver / cambiar preferencias del CLI (idioma, …)
  update          Buscar una versión más nueva y ejecutar la actualización correspondiente
  version         Imprimir la versión del build
  help            Mostrar este mensaje

Ejecuta 'everyapi <comando> help' para ver detalles y opciones de subcomandos
(por ejemplo 'everyapi seller help', 'everyapi edge help').
'''
