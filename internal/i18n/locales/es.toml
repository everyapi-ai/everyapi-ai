# Traducciones al español para las cadenas propias del CLI.
#
# Para añadir una nueva clave: añádela aquí Y en en.toml en la misma
# ruta. Las claves ausentes en es vuelven al valor de en
# automáticamente; las claves ausentes en AMBOS devuelven la clave en
# bruto (falla ruidosa para el desarrollador).
#
# Los bloques USAGE multilínea usan las cadenas literales multilínea
# de TOML ('''…'''). No interpretan escapes de barra invertida, por
# lo que el texto entre comillas invertidas de Go cae sin cambios.
# TOML elimina el salto de línea inmediatamente después del ''' de
# apertura — igual que las cadenas raw de Go cuando la comilla
# invertida queda al final de línea — así que escribe el bloque
# pegado a la izquierda y la salida renderizada comienza donde el
# usuario espera.
#
# Para añadir un nuevo idioma: deja un {lang}.toml en este directorio;
# el cargador lo recoge en init(). No se necesitan cambios de código
# más allá de añadir la constante Lang* e incluirla en
# SupportedLanguages.

