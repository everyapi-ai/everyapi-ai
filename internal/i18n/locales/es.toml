[admin.help]
usage = '''
everyapi admin — comandos de operador (solo admin)

USO
  everyapi admin <subcommand> [flags]

SUBCOMANDOS
  marketplace status     Muestra el indicador marketplace.enabled actual
  marketplace on         Abrir el marketplace (BYO-GPU + flujo de vendedor)
  marketplace off        Cerrarlo; los nodos en marcha siguen
  user search <keyword>  Búsqueda difusa por usuario / correo / nombre visible
  user show <id>         Un registro de usuario
  user list [--page P]   Lista paginada de usuarios
  user manage <id> --action enable|disable|delete|promote_admin|demote_admin
                         Aplica una acción de estado/rol (el backend valida el rol)
  channel test <id>      Comprobar el estado de un canal
  channel tag <name> --enable|--disable
                         Conmutar en bloque los canales con la etiqueta
  log tail [--user U] [--model M] [--channel C] [--group G] [--since W]
                         Búsqueda paginada del registro
  abuse list [--status]  Reportes presentados
  abuse show <id>        Un reporte
  abuse update <id> --status X [--note N]
                         Gestionar un reporte
  audit [--page P]       Entradas recientes del registro de auditoría
  redemption list|search <kw>|show <id>|create --name N --quota Q [--count C] [--expires E]
             |update <id>|status <id> enable|disable|delete <id>|clear-invalid
                         Gestiona códigos de canje de cuota (al crear genera e imprime claves)
  help                   Mostrar este mensaje

Auth: reutiliza tu token de 'everyapi auth login'; debes ser admin en el backend (los no admin reciben 403).

Toda acción queda en el mismo registro de auditoría que escribe el panel.
'''
